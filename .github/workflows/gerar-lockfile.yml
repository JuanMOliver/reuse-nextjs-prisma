name: Gerar package-lock.json com versoes reproduziveis

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gerar-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package.json
      - name: Gerar lockfile sem executar scripts de pacotes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commitar apenas o lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile ja atualizado."
          else
            git commit -m "chore: gerar package-lock seguro para deploy reproduzivel"
            git push origin HEAD:main
          fi
