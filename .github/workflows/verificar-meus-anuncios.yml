name: Verificar Next.js - Meus Anuncios
on:
  push:
    branches: [main]
    paths:
      - 'apps/meus-anuncios/**'
      - '.github/workflows/verificar-meus-anuncios.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/meus-anuncios
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias e gerar lockfile
        run: npm install --no-audit --no-fund
      - name: Rodar testes
        run: npm test
      - name: Compilar Next.js
        run: npm run build
      - name: Arquivo lock gerado para reproducibilidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reuse-nextjs-package-lock
          path: apps/meus-anuncios/package-lock.json
          if-no-files-found: ignore
